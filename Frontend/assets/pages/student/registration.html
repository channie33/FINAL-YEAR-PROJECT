<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Better Space</title>
    <link rel="stylesheet" href="/assets/css/shared/registration.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="better">Better</span><br>
            <span class="space">space</span>
        </div>
        <h1 class="page-title"><center>WELCOME !</center></h1>
    </header>

    <main class="container">
        <div class="form-container">
            <h2 class="form-title"><b>STUDENT</b></h2>
            
            <form id="studentForm">
                <div class="form-group">
                    <label>NAME:</label>
                    <input type="text" id="student-name" required>
                </div>
                
                <div class="form-group">
                    <label>EMAIL:</label>
                    <input type="email" id="student-email" required>
                </div>
                
                <div class="form-group">
                    <label>PASSWORD:</label>
                    <input type="password" id="student-password" required>
                </div>

                <div class="password-rules" aria-live="polite">
                    <p class="password-rules-title">Password must include:</p>
                    <ul>
                        <li>At least 8 characters</li>
                        <li>At least one uppercase letter (A-Z)</li>
                        <li>At least one lowercase letter (a-z)</li>
                        <li>At least one number (0-9)</li>
                        <li>At least one special character (e.g. !@#$%^&*)</li>
                    </ul>
                </div>
                
                <div class="form-group">
                    <label>CONFIRM PASSWORD:</label>
                    <input type="password" id="student-confirm-password" required>
                </div>
                <div class="guidelines-check">
                    <input type="checkbox" id="student-guidelines" required>
                    <label for="student-guidelines">
                        I have read and agree to the
                        <a href="/pages/shared/guidelines.html" target="_blank">Community Guidelines</a>
                    </label>
                </div>
                <button type="submit" class="next-btn">NEXT</button>
            </form>
        </div>
    </main>

    <script src="/assets/js/student/student-registration.js"></script>
</body>
</html>
