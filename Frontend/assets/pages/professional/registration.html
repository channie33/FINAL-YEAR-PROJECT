<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Registration - Better Space</title>
    <link rel="stylesheet" href="/assets/css/shared/registration.css">
</head>

<body>
    <header class="header">
        <div class="logo">
            <span class="better">Better</span><br>
            <span class="space">space</span></a>
        </div>
        <h1 class="page-title">
            <center>WELCOME !</center>
        </h1>
    </header>

    <main class="container">
        <div class="form-container">
            <h2 class="form-title"><b>MENTAL HEALTH PROFESSIONAL</b></h2>

            <form id="professionalForm">
                <div class="form-group">
                    <label>NAME:</label>
                    <input type="text" id="professional-name" required>
                </div>

                <div class="form-group">
                    <label>EMAIL:</label>
                    <input type="email" id="professional-email" required>
                </div>

                <div class="form-group">
                    <label>PASSWORD:</label>
                    <input type="password" id="professional-password" required>
                </div>

                <div class="password-rules" aria-live="polite">
                    <p class="password-rules-title">Password must include:</p>
                    <ul>
                        <li>At least 8 characters</li>
                        <li>At least one uppercase letter (A-Z)</li>
                        <li>At least one lowercase letter (a-z)</li>
                        <li>At least one number (0-9)</li>
                        <li>At least one special character (e.g. !@#$%^&*)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label>CONFIRM PASSWORD:</label>
                    <input type="password" id="professional-confirm-password" required>
                </div>
                <div class="guidelines-check">
                    <input type="checkbox" id="professional-guidelines" required>
                    <label for="professional-guidelines">
                        I have read and agree to the
                        <a href="/pages/shared/guidelines.html" target="_blank">Community Guidelines</a>
                    </label>
                </div>
                <button type="submit" class="next-btn">NEXT</button>
            </form>
        </div>
    </main>

    <script src="/assets/js/professional/professional-registration.js"></script>
</body>

</html>
