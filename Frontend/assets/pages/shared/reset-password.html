<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Reset Password - BetterSpace</title>
    <link rel="stylesheet" href="/assets/css/shared/login.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="better">Better</span><br>
            <span class="space">space</span>
        </div>
        <h1 class="page-title"><center>RESET PASSWORD</center></h1>
    </header>

    <main class="container">
        <div class="form-container">
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label>OTP CODE:</label>
                    <input type="text" id="otp" name="otp_code" maxlength="6" placeholder="6-digit code from email" required>
                    <small style="display: block; margin-top: 5px; font-size: 12px; color: #666;">Check your email for the OTP</small>
                </div>

                <div class="form-group">
                    <label>NEW PASSWORD:</label>
                    <input type="password" id="newPassword" name="new_password" required>
                    <small style="display: block; margin-top: 5px; font-size: 12px; color: #666;">Min 8 chars, uppercase, lowercase, numbers</small>
                </div>

                <div class="form-group">
                    <label>CONFIRM PASSWORD:</label>
                    <input type="password" id="confirmPassword" name="confirm_password" required>
                </div>

                <button type="submit" class="next-btn">RESET PASSWORD</button>
            </form>

            <div class="form-links" style="margin-top: 30px;">
                <a href="login.html" style="color: #1a4d3e; text-decoration: none;">← Back to Login</a>
            </div>

            <div id="message" class="message" style="text-align: center; margin-top: 15px; font-size: 14px;"></div>
        </div>
    </main>

    <script src="/assets/js/shared/reset-password.js"></script>
</body>
</html>
