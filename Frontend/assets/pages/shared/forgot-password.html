<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Forgot Password - BetterSpace</title>
    <link rel="stylesheet" href="/assets/css/shared/login.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="better">Better</span><br>
            <span class="space">space</span>
        </div>
        <h1 class="page-title"><center>FORGOT PASSWORD</center></h1>
    </header>

    <main class="container">
        <div class="form-container">
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>EMAIL ADDRESS:</label>
                    <input type="email" id="email" required>
                </div>

                <p style="font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5;">
                    Enter your email and we'll send you an OTP to reset your password
                </p>

                <button type="submit" class="next-btn">SEND OTP</button>
            </form>

            <div class="form-links" style="margin-top: 30px;">
                <a href="login.html" style="color: #1a4d3e; text-decoration: none;">← Back to Login</a>
            </div>

            <div id="message" class="message" style="text-align: center; margin-top: 15px; font-size: 14px;"></div>
        </div>
    </main>

    <script src="/assets/js/shared/forgot-password.js"></script>
</body>
</html>
